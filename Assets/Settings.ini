; Palpedia Enhancer settings. Edit and save while the game is running: the mod notices the
; change and applies it, no relaunch (see LiveReloadSeconds at the bottom). The three
; DefaultXxx settings describe how the Palpedia opens, so they take effect the next time you
; open it.
; This file lives in the mod's Assets folder and is replaced when the mod updates.
; Every key name below is a letter, a digit or F1 to F12, with optional Ctrl+, Shift+ and Alt+
; prefixes, and None to unbind. A value this file cannot read is reported in UE4SS.log and the
; setting keeps its default.

; Hotkey that shows only the Palpedia entries you have not opened yet. A key name such as N, F7
; or Ctrl+N; None unbinds it.
ToggleUnreadKey=Ctrl+N

; Hotkey that puts every filter, sort and search target back to the defaults below. A key name
; such as N, F7 or Ctrl+N; None unbinds it.
ClearAllKey=None

; Hotkey that marks every unread Palpedia entry as opened, the same as the Mark All Seen button.
; A key name such as N, F7 or Ctrl+N; None unbinds it.
MarkAllSeenKey=None

; Keep your filters, sort and search targets when you close and reopen the Palpedia. They still
; go back to the defaults below when you restart the game.
RememberState=true

; Show the Mark All Seen button beside the Stats tab. The MarkAllSeenKey hotkey above works
; whether the button is shown or not.
ShowMarkAllSeenButton=true

; The order the Palpedia list opens in, and the one Clear All returns to.
; One of: Default, Name, Element, WorkType, Discovery, Ownership, UnreadFirst
DefaultSort=Default

; Open the Palpedia with that order reversed, so the last or highest entry comes first.
DefaultSortDescending=false

; Open the Palpedia already showing only the entries you have not opened yet.
DefaultUnreadOnly=false

; What the search box looks in when the Palpedia opens, joined with commas for more than one.
; One of: Name, Drops, Ranch, Desc
DefaultSearchTargets=Name

; Once per game start, ask alkeari.com for the newest published version of this mod and show a
; notice only when it is newer than the one installed. Nothing is sent but that one request.
CheckForUpdates=true

; Write per-open diagnostics to UE4SS.log. Leave off unless reporting a bug.
VerboseLogging=false

; How often this file is checked for an edit, in seconds. 0 turns the check off, and settings are
; then read only when the game starts.
; Range: 0 to 60
LiveReloadSeconds=2
