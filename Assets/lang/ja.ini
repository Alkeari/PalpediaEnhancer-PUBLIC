tt_search_button=名前、ドロップ、牧場の生産物、説明でパルを検索します。
tt_sort_button=図鑑の並び順を選びます。
tt_filter_button=表示するパルを絞り込みます。
tt_close=このウィンドウを閉じます。
tt_clear_search=検索をクリアし、名前のみの検索に戻します。
tt_default=ゲーム本来の並び順。選択中の並び替えをもう一度選んでも戻ります。
tt_by_name=名前順に並べます。
tt_by_element=属性ごとにまとめます（ゲーム内の順）。複属性のパルは最初の属性に入ります。
tt_by_work_type=最初の作業適性ごとにまとめます（ゲーム内の順）。適性のないパルは最後です。
tt_by_discovery=捕獲済み、遭遇済み、新着でまとめます。
tt_by_ownership=所持 5+、所持、遭遇のみ、未発見の順に並べます。
tt_unread_first=未読の項目を先頭に浮かせます。
tt_descending=並び順を反転します。降順では最後または最大が先頭になります。
tt_new=まだ開いていない項目だけを表示します。
tt_clear_all=すべてのフィルターを解除します。
tt_mark_all_seen=すべての図鑑項目を既読にし、各項目を開かずに新着マークを消します。
tt_unowned=一度も捕獲していないパルだけを表示します。
tt_owned=捕獲済みだが捕獲ボーナスが未達成のパルだけを表示します。
tt_owned_5plus=5回以上捕獲したパルだけを表示します。
tt_undiscovered=一度も遭遇していないパルだけを表示します。
tt_seen=遭遇したが捕獲していないパルだけを表示します。
tt_caught=捕獲したパルだけを表示します。
tt_element=この属性のパルだけを表示します。
tt_work=この作業適性を持つパルだけを表示します。
tt_name=パルの名前で検索します。
tt_drops=倒したときや捕獲したときのドロップで検索します。
tt_ranch=牧場でそのアイテムを生産するパルを表示します。
tt_desc=パートナースキルと図鑑の説明文を検索します。
