tt_search_button=Search Palpedia entries by name, drop, ranch produce, or description.
tt_sort_button=Choose how the Palpedia list is ordered.
tt_filter_button=Choose which Palpedia entries are shown.
tt_close=Close this window.
tt_clear_search=Clear the search and go back to searching by name only.
tt_default=The game's own order. Picking an active sort again also returns here.
tt_by_name=Order by name.
tt_by_element=Group by element, in the game's own order. Dual-type Pals group under their first.
tt_by_work_type=Group by a Pal's first work suitability, in the game's own order. Pals with none go last.
tt_by_discovery=Group by whether a Pal is caught, seen, or new.
tt_by_ownership=Owned 5+ first, then owned, then seen but unowned, then never seen.
tt_unread_first=Float unopened entries to the top.
tt_descending=Flip the sort order: descending applies last or highest first.
tt_new=Show only entries you have not opened yet.
tt_clear_all=Turn every filter off.
tt_mark_all_seen=Mark every Palpedia entry as seen, clearing the new dots without opening each one.
tt_unowned=Show only Pals you have never caught.
tt_owned=Show only Pals caught once but not to bonus completion.
tt_owned_5plus=Show only Pals caught five or more times.
tt_undiscovered=Show only Pals you have never seen.
tt_seen=Show only Pals you have seen but not caught.
tt_caught=Show only Pals you have caught.
tt_element=Show only Pals of this element.
tt_work=Show only Pals with this work suitability.
tt_name=Search by Pal name.
tt_drops=Search by what a Pal drops when defeated or captured.
tt_ranch=Pals that produce the item at the ranch.
tt_desc=Search the Pal's partner skill and Palpedia description text.
