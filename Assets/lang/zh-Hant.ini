clear_search=X
search_hint=搜尋
update_available=Palpedia Enhancer {0} 已發布。
sec_ownership=持有狀態
sec_met=遇見狀態
sec_type=帕魯屬性
sec_work=工作適性
sec_sort_by=排序依據
sec_order=順序
tt_search_button=依名稱、掉落物、牧場產物或描述搜尋帕魯圖鑑。
tt_sort_button=選擇帕魯圖鑑清單的排序方式。
tt_filter_button=選擇顯示哪些帕魯圖鑑條目。
tt_close=關閉此視窗。
tt_clear_search=清除搜尋內容，恢復為僅依名稱搜尋。
tt_default=遊戲原本的順序。再次選擇目前的排序也會回到這裡。
tt_by_name=依名稱排序。
tt_by_element=依屬性分組（遊戲內順序）。雙屬性帕魯歸入第一屬性。
tt_by_work_type=依帕魯的第一項工作適性分組（遊戲內順序）。沒有適性的排在最後。
tt_by_discovery=依已捕獲、已遇見或新條目分組。
tt_by_ownership=持有 5+ 在前，接著是已持有、僅遇見、從未遇見。
tt_unread_first=將未讀條目置頂。
tt_descending=反轉排序：降冪時最後或最大的排在最前。
tt_new=僅顯示尚未開啟過的條目。
tt_clear_all=關閉所有篩選。
tt_mark_all_seen=將所有帕魯圖鑑條目標記為已讀，不必逐一開啟即可清除新條目標記。
tt_unowned=僅顯示從未捕獲的帕魯。
tt_owned=僅顯示已捕獲但未達成捕獲獎勵的帕魯。
tt_owned_5plus=僅顯示捕獲五次以上的帕魯。
tt_undiscovered=僅顯示從未遇見的帕魯。
tt_seen=僅顯示遇見過但未捕獲的帕魯。
tt_caught=僅顯示已捕獲的帕魯。
tt_element=僅顯示該屬性的帕魯。
tt_work=僅顯示具有該工作適性的帕魯。
tt_name=依帕魯名稱搜尋。
tt_drops=依擊敗或捕獲時的掉落物搜尋。
tt_ranch=在牧場生產該物品的帕魯。
tt_desc=搜尋帕魯的夥伴技能與圖鑑描述文字。
