# Palpedia Enhancer UI strings (zh-Hans). key=value, UTF-8. Missing keys fall back to English.
filters=筛选
sort=排序
filter=筛选
close=关闭
default=默认
by_name=按名称
by_element=按属性
by_work_type=按工作适性
by_discovery=按发现状态
by_ownership=按持有数
unread_first=未读优先
descending=降序
new=新
clear_all=全部清除
mark_all_seen=全部标为已读
unowned=未持有
owned=已持有
owned_5plus=持有 5+
undiscovered=未发现
seen=已遇见
caught=已捕获
name=名称
drops=掉落
ranch=牧场
desc=描述
clear_search=X
search_hint=搜索
update_available=Palpedia Enhancer {0} 已发布。
sec_ownership=持有状态
sec_met=遇见状态
sec_type=帕鲁属性
sec_work=工作适性
sec_sort_by=排序依据
sec_order=顺序
tt_search_button=按名称、掉落物、牧场产物或描述搜索帕鲁图鉴。
tt_sort_button=选择帕鲁图鉴列表的排序方式。
tt_filter_button=选择显示哪些帕鲁图鉴条目。
tt_close=关闭此窗口。
tt_clear_search=清除搜索内容，恢复为仅按名称搜索。
tt_default=游戏原本的顺序。再次选择当前排序也会回到这里。
tt_by_name=按名称排序。
tt_by_element=按属性分组（游戏内顺序）。双属性帕鲁归入第一属性。
tt_by_work_type=按帕鲁的第一项工作适性分组（游戏内顺序）。没有适性的排在最后。
tt_by_discovery=按已捕获、已遇见或新条目分组。
tt_by_ownership=持有 5+ 在前，然后是已持有、仅遇见、从未遇见。
tt_unread_first=将未读条目置顶。
tt_descending=反转排序：降序时最后或最大的排在最前。
tt_new=仅显示尚未打开过的条目。
tt_clear_all=关闭所有筛选。
tt_mark_all_seen=将所有帕鲁图鉴条目标记为已读，无需逐个打开即可清除新条目标记。
tt_unowned=仅显示从未捕获的帕鲁。
tt_owned=仅显示已捕获但未达成捕获奖励的帕鲁。
tt_owned_5plus=仅显示捕获五次及以上的帕鲁。
tt_undiscovered=仅显示从未遇见的帕鲁。
tt_seen=仅显示遇见过但未捕获的帕鲁。
tt_caught=仅显示已捕获的帕鲁。
tt_element=仅显示该属性的帕鲁。
tt_work=仅显示具有该工作适性的帕鲁。
tt_name=按帕鲁名称搜索。
tt_drops=按击败或捕获时的掉落物搜索。
tt_ranch=在牧场生产该物品的帕鲁。
tt_desc=搜索帕鲁的伙伴技能和图鉴描述文本。
