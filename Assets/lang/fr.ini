tt_search_button=Rechercher dans le Paldeck par nom, butin, production au ranch ou description.
tt_sort_button=Choisir l'ordre de la liste du Paldeck.
tt_filter_button=Choisir les entrées du Paldeck à afficher.
tt_close=Fermer cette fenêtre.
tt_clear_search=Effacer la recherche et revenir à la recherche par nom seulement.
tt_default=L'ordre du jeu. Choisir à nouveau le tri actif y revient aussi.
tt_by_name=Trier par nom.
tt_by_element=Grouper par élément, dans l'ordre du jeu. Les Pals à deux éléments suivent le premier.
tt_by_work_type=Grouper par première aptitude de travail, dans l'ordre du jeu. Les Pals sans aptitude en dernier.
tt_by_discovery=Grouper selon que le Pal est capturé, vu ou nouveau.
tt_by_ownership=Possédé 5+ d'abord, puis possédé, puis vu mais non possédé, puis jamais vu.
tt_unread_first=Remonter les entrées non ouvertes en haut.
tt_descending=Inverser le tri : en décroissant, le dernier ou le plus élevé vient en premier.
tt_new=Afficher seulement les entrées pas encore ouvertes.
tt_clear_all=Désactiver tous les filtres.
tt_mark_all_seen=Marque toutes les entrées du Paldeck comme vues et retire les points de nouveauté sans ouvrir chaque entrée.
tt_unowned=Afficher seulement les Pals jamais capturés.
tt_owned=Afficher seulement les Pals capturés sans bonus de capture complet.
tt_owned_5plus=Afficher seulement les Pals capturés cinq fois ou plus.
tt_undiscovered=Afficher seulement les Pals jamais vus.
tt_seen=Afficher seulement les Pals vus mais non capturés.
tt_caught=Afficher seulement les Pals capturés.
tt_element=Afficher seulement les Pals de cet élément.
tt_work=Afficher seulement les Pals ayant cette aptitude de travail.
tt_name=Rechercher par nom de Pal.
tt_drops=Rechercher par butin obtenu en vainquant ou capturant un Pal.
tt_ranch=Pals qui produisent cet objet au ranch.
tt_desc=Rechercher dans la compétence partenaire et la description du Paldeck.
